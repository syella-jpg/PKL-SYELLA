<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload File Laporan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --red: #e31e24; --red-dark: #c8141a; --ink: #1f2430; --muted: #6b7280; --line: #d9dce1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #f4f4f4; color: var(--ink); min-height: 100vh; }

  /* ===== Header ===== */
  header {
    background: #fff; height: 56px; padding: 0 28px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #e6e6e6;
  }
  .brand { display: flex; align-items: center; gap: 22px; }
  .logo { display: inline-flex; align-items: flex-start; gap: 1px; font-weight: 700; font-style: italic; font-size: 21px; letter-spacing: -.5px; color: var(--red); text-decoration: none; }
  .logo svg { width: 16px; height: 16px; margin-top: -4px; }
  .divider { width: 1px; height: 20px; background: var(--line); }
  .user { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: #e5e7eb; display: grid; place-items: center; font-size: 10px; font-weight: 700; }

  /* ===== Kartu ===== */
  main { padding: 38px 16px 48px; }
  .card { max-width: 568px; margin: 0 auto; background: #fff; border-radius: 24px; padding: 36px 32px 32px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  h1 { font-size: 20px; font-weight: 700; }
  .sub { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .label { display: block; font-size: 12px; font-weight: 700; margin: 28px 0 8px; }
  .label + .select-wrap { margin-top: 0; }

  /* ===== Pilihan ===== */
  .select-wrap { position: relative; }
  .select-wrap select, .select-wrap input {
    width: 100%; height: 38px; appearance: none; -webkit-appearance: none;
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
    padding: 0 40px 0 40px; font-family: inherit; font-size: 13px; color: var(--ink); cursor: pointer;
  }
  .select-wrap select:invalid { color: var(--ink); }
  .select-wrap select:focus-visible, .select-wrap input:focus-visible { outline: 3px solid rgba(227,30,36,.25); border-color: var(--red); }
  .select-wrap.err select, .select-wrap.err input { border-color: var(--red); }
  .select-wrap .chev { position: absolute; z-index: 1; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .select-wrap .chev { right: 14px; width: 14px; height: 14px; stroke: #4b5563; }
  #bagianOptions { display: none; position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; right: 0; max-height: 220px; overflow-y: auto; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: #fff; box-shadow: 0 8px 20px rgba(31,36,48,.14); }
  #bagian { cursor: text; }
  #bagianWrap.open #bagianOptions { display: block; }
  #bagianOptions button { display: block; width: 100%; padding: 9px 12px; border: 0; border-radius: 6px; background: transparent; color: var(--ink); text-align: left; font: inherit; font-size: 13px; cursor: pointer; }
  #bagianOptions button:hover, #bagianOptions button[aria-selected="true"] { background: #fff0ef; color: var(--red-dark); }

  /* ===== Dropzone ===== */
  .drop {
    border: 2px dashed var(--red); border-radius: 12px; background: #fff7f6;
    min-height: 204px; padding: 24px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .drop:hover, .drop.over { background: #ffeceb; }
  .drop:focus-visible { outline: 3px solid rgba(227,30,36,.3); outline-offset: 2px; }
  .drop.err { background: #fff0ef; }
  .cloud { width: 50px; height: 50px; border-radius: 50%; background: #ffe4e2; display: grid; place-items: center; margin-bottom: 18px; }
  .cloud svg { width: 24px; height: 24px; stroke: var(--red); }
  .drop strong { font-size: 13px; font-weight: 700; }
  .drop p { margin-top: 6px; font-size: 11px; color: var(--muted); }
  .chip { margin-top: 14px; background: #eef0f3; border-radius: 6px; padding: 5px 12px; font-size: 10px; font-weight: 600; color: #4b5563; }

  /* File terpilih */
  .picked { display: none; align-items: center; gap: 12px; width: 100%; max-width: 380px; background: #fff; border: 1px solid #f3c9c7; border-radius: 10px; padding: 12px 14px; text-align: left; }
  .drop.has-file .empty { display: none; }
  .drop.has-file .picked { display: flex; }
  .picked .fic { width: 36px; height: 36px; border-radius: 8px; background: #ffe4e2; display: grid; place-items: center; flex-shrink: 0; }
  .picked .fic svg { width: 18px; height: 18px; stroke: var(--red); }
  .picked .meta { flex: 1; min-width: 0; }
  .picked .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .picked .size { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .picked .rm { border: 0; background: #f3f4f6; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 16px; line-height: 1; color: #4b5563; }
  .picked .rm:hover { background: #e5e7eb; }

  /* ===== Status & progress ===== */
  .msg { margin-top: 12px; font-size: 12px; min-height: 18px; }
  .msg.error { color: var(--red-dark); }
  .msg.ok { color: #15803d; font-weight: 600; }
  .bar { display: none; height: 6px; border-radius: 3px; background: #eceef1; overflow: hidden; margin-top: 6px; }
  .bar.on { display: block; }
  .bar i { display: block; height: 100%; width: 0; background: var(--red); transition: width .15s; }

  .actions { display: flex; justify-content: flex-end; margin-top: 10px; }
  .actions .clear-local { margin-right: auto; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); padding: 0 12px; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; }
  .actions .clear-local:hover { background: #f4f4f4; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 22px;
    border: 0; border-radius: 10px; background: var(--red); color: #fff;
    font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; transition: background .15s;
  }
  .btn svg { width: 15px; height: 15px; stroke: #fff; }
  .btn:hover:not(:disabled) { background: var(--red-dark); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn:focus-visible { outline: 3px solid rgba(227,30,36,.35); outline-offset: 2px; }

  @media (max-width: 520px) {
    header { padding: 0 14px; }
    .user span.t { display: none; }
    .card { padding: 26px 18px 24px; border-radius: 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <a class="logo" href="#" aria-label="Konimex">KONIMEX
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="6" r="4" fill="#e31e24"/><circle cx="17" cy="9" r="4" fill="#e31e24"/><circle cx="10" cy="16" r="4" fill="#e31e24"/></svg>
    </a>
    <span class="divider"></span>
  </div>
  <div class="user"><div class="avatar" id="avatar">AD</div><span class="t" id="userName">Welcome, Administrator</span></div>
</header>

<main>
  <form class="card" id="form" novalidate>
    <h1>Upload File Laporan</h1>
    <p class="sub">Pilih bagian laporan dan periode sebelum mengunggah dokumen ke sistem Konimex.</p>

    <label class="label" for="bagian">Bagian File Laporan</label>
    <div class="select-wrap" id="bagianWrap">
      <input id="bagian" type="text" required autocomplete="off" placeholder="Ketik atau pilih bagian laporan" aria-label="Bagian file laporan" aria-autocomplete="list" aria-controls="bagianOptions" aria-expanded="false">
      <datalist id="daftarBagian">
        <option value="IB"></option>
        <option value="ETHICAL"></option>
        <option value="MTM"></option>
        <option value="UNIT"></option>
        <option value="REVENUE VERSI EDP MNJ"></option>
        <option value="REVENUE VERSI EDP MNJ Target"></option>
        <option value="BIAYA"></option>
        <option value="TARGET REVENUE"></option>
        <option value="DAFTAR"></option>
        <option value="LAUNCH"></option>
        <option value="BOD KX Sell In"></option>
        <option value="BOD MNJ"></option>
        <option value="BOD JML SDM"></option>
        <option value="BOD BI. Opr"></option>
        <option value="RATIO UPB"></option>
        <option value="UP BJ kx"></option>
        <option value="UPB non BJ"></option>
        <option value="UPB Distr"></option>
        <option value="PARETO UPB DISTR"></option>
        <option value="complaint - Accident"></option>
        <option value="NEAR ED TW 3"></option>
        <option value="TOP 10 NEAR ED TW 3"></option>
        <option value="Revenue Konimex Selling Out"></option>
      </datalist>
      <div id="bagianOptions" role="listbox" aria-label="Pilihan bagian laporan"></div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </div>

    <label class="label" for="periode">Periode Laporan</label>
    <div class="select-wrap">
      <select id="periode" required aria-label="Periode laporan"></select>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </div>

    <span class="label" id="fileLabel">File Dokumen</span>
    <div class="drop" id="drop" role="button" tabindex="0" aria-labelledby="fileLabel">
      <input type="file" id="file" accept=".xlsx,.ods" hidden>
      <div class="empty" style="display:flex;flex-direction:column;align-items:center">
        <div class="cloud">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 16.58A5 5 0 0018 7h-1.26A8 8 0 104 15.25"/><path d="M12 12v9M8 16l4-4 4 4"/></svg>
        </div>
        <strong>Drag &amp; drop file di sini</strong>
        <p>atau klik untuk memilih file dari komputer Anda</p>
        <span class="chip">.Ods, .xlsx (Maks. 50MB)</span>
      </div>
      <div class="picked">
        <div class="fic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg></div>
        <div class="meta"><div class="name" id="fname"></div><div class="size" id="fsize"></div></div>
        <button type="button" class="rm" id="rm" aria-label="Hapus file">&times;</button>
      </div>
    </div>

    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>

    <div class="actions">
      <button type="button" class="clear-local" id="clearLocal">Hapus Data Tersimpan</button>
      <button type="submit" class="btn" id="submit">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        <span id="btnText">Upload File</span>
      </button>
    </div>
  </form>
</main>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
  /* ================= PENGATURAN (isi sesuai kebutuhan) ================= */
  // Saat dibuka langsung dengan file://, laporan Sell Out diproses di browser
  // dan disimpan ke localStorage; tidak perlu server PHP atau database.
  const LOCAL_FILE_MODE = location.protocol === "file:";

  const UPLOAD_URL = LOCAL_FILE_MODE ? "" : "upload.php";

  const ALLOWED = ["xlsx", "ods"];
  const MAX_MB = 50;
  const PROCESSED_KEY = "konimex_revenue_so_processed";
  const TARGET_KEY = "konimex_revenue_so_targets_processed";
  const SELL_OUT_TARGET_KEY = "konimex_revenue_so_sellout_targets_processed";
  const TARGET_API_URL = LOCAL_FILE_MODE
    ? "http://127.0.0.1:8000/dashboard/revenue_so_targets_api.php"
    : "../dashboard/revenue_so_targets_api.php";
  const EDP_MNJ_TARGET_API_URL = LOCAL_FILE_MODE
    ? "http://127.0.0.1:8000/dashboard/revenue_edp_mnj_target_api.php"
    : "../dashboard/revenue_edp_mnj_target_api.php";

  // Nama pengguna di header (opsional)
  const USER_NAME = "Administrator";
  /* ===================================================================== */

  const $ = (id) => document.getElementById(id);
  const sectionSelect = $("bagian");
  const form = $("form"), drop = $("drop"), fileInput = $("file"), periodSelect = $("periode");
  const msg = $("msg"), bar = $("bar"), barFill = $("barFill"), btn = $("submit"), btnText = $("btnText");
  let chosen = null, busy = false;

  const sectionOptions = Array.from($("daftarBagian").options, (option) => option.value);
  const sectionMenu = $("bagianOptions");
  let highlightedSection = -1;
  function renderSectionOptions() {
    const query = sectionSelect.value.trim().toLocaleLowerCase();
    const matches = sectionOptions.filter((name) => name.toLocaleLowerCase().includes(query));
    highlightedSection = -1;
    sectionMenu.innerHTML = matches.map((name, index) => '<button type="button" role="option" aria-selected="false" data-section-index="' + index + '">' + name.replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char])) + '</button>').join("");
    $("bagianWrap").classList.toggle("open", matches.length > 0);
    sectionSelect.setAttribute("aria-expanded", String(matches.length > 0));
  }
  function closeSectionOptions() {
    $("bagianWrap").classList.remove("open");
    sectionSelect.setAttribute("aria-expanded", "false");
  }
  function chooseSection(name) {
    sectionSelect.value = name;
    closeSectionOptions();
    $("bagianWrap").classList.remove("err");
    sectionSelect.focus();
  }
  sectionSelect.addEventListener("focus", renderSectionOptions);
  sectionSelect.addEventListener("input", () => { $("bagianWrap").classList.remove("err"); renderSectionOptions(); });
  sectionSelect.addEventListener("keydown", (event) => {
    const items = Array.from(sectionMenu.querySelectorAll("[role=option]"));
    if (event.key === "Escape") { closeSectionOptions(); return; }
    if (event.key === "ArrowDown" && items.length) {
      event.preventDefault(); highlightedSection = Math.min(highlightedSection + 1, items.length - 1);
    } else if (event.key === "ArrowUp" && items.length) {
      event.preventDefault(); highlightedSection = Math.max(highlightedSection - 1, 0);
    } else if (event.key === "Enter" && $("bagianWrap").classList.contains("open") && items.length) {
      event.preventDefault(); chooseSection(items[Math.max(highlightedSection, 0)].textContent); return;
    } else return;
    items.forEach((item, index) => item.setAttribute("aria-selected", String(index === highlightedSection)));
    items[highlightedSection].scrollIntoView({ block: "nearest" });
  });
  sectionMenu.addEventListener("mousedown", (event) => event.preventDefault());
  sectionMenu.addEventListener("click", (event) => {
    const option = event.target.closest("[role=option]");
    if (option) chooseSection(option.textContent);
  });
  document.addEventListener("click", (event) => {
    if (!$("bagianWrap").contains(event.target)) closeSectionOptions();
  });

  // Header
  $("userName").textContent = "Welcome, " + USER_NAME;
  $("avatar").textContent = USER_NAME.slice(0, 2).toUpperCase();

  const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  const now = new Date();
  for (let year = now.getFullYear(); year >= 2025; year--) {
    for (let month = 12; month >= 1; month--) {
      if (year === now.getFullYear() && month > now.getMonth() + 1) continue;
      const option = document.createElement("option");
      option.value = year + "-" + String(month).padStart(2, "0");
      option.textContent = monthNames[month - 1] + " " + year;
      periodSelect.appendChild(option);
    }
  }

  function setMsg(text, type) {
    msg.textContent = text || "";
    msg.className = "msg" + (type ? " " + type : "");
  }
  function fmtSize(b) {
    if (b < 1024) return b + " B";
    if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
    return (b / 1048576).toFixed(2) + " MB";
  }

  // Ambil baris TOTAL di semua sheet, tanpa mengandalkan posisi baris tetap.
  // Hanya nilai pada kolom REV TOTAL yang dipertahankan.
  async function processRevenueSO(file) {
    if (!window.XLSX) throw new Error("Komponen pembaca spreadsheet gagal dimuat.");
    const workbook = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: false });
    const records = [];
    const labelRules = [
      [/^TOTAL\s+GB\s*(\d+)$/i, (m) => ({ code: "gb" + m[1], label: "TOTAL GB " + m[1] })],
      [/^TOTAL\s+EXISTING\s+GB(?:\s*(\d+))?$/i, (m, gb) => ({ code: "existing" + (m[1] || gb || ""), label: "TOTAL EXISTING GB" + (m[1] || gb ? " " + (m[1] || gb) : "") })],
      [/^TOTAL\s+NEW\s+PRODUCT\s+GB(?:\s*(\d+))?$/i, (m, gb) => ({ code: "new" + (m[1] || gb || ""), label: "TOTAL NEW PRODUCT GB" + (m[1] || gb ? " " + (m[1] || gb) : "") })],
      [/^(?:TOTAL\s+)?EXIST(?:ING)?\s+ETH$/i, () => ({ code: "ethicalExisting", label: "EXIST ETH" })],
      [/^(?:TOTAL\s+)?(?:NP|NEW\s+PRODUCT)\s+ETH$/i, () => ({ code: "ethicalNew", label: "NP ETH" })],
      [/^TOTAL\s+ETH$/i, () => ({ code: "ethicalTotal", label: "TOTAL ETH" })]
    ];
    workbook.SheetNames.forEach((sheetName) => {
      const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: "", raw: true });
      let headerRow = -1, revColumn = -1, revMonthColumns = [];
      for (let r = 0; r < rows.length && headerRow < 0; r++) {
        const headers = rows[r].map((value) => String(value).trim().replace(/\s+/g, " ").toUpperCase());
        const c = headers.indexOf("REV TOTAL");
        if (c >= 0) {
          headerRow = r;
          revColumn = c;
          revMonthColumns = ["JAN", "FEB", "MAR", "APR", "MEI", "JUN", "JUL", "AGT", "SEP", "OKT", "NOV", "DES"]
            .map((month) => headers.indexOf("REV " + month));
        }
      }
      if (headerRow < 0) return;
      rows.forEach((row, index) => {
        if (index <= headerRow) return;
        const cells = row.map((value) => String(value == null ? "" : value).trim());
        const gbCell = cells.map((value) => value.match(/^GB\s*(\d+)$/i)).find(Boolean);
        const rowGb = gbCell && gbCell[1];
        const match = cells.map((value) => {
          for (const [pattern, makeRecord] of labelRules) {
            const found = value.match(pattern);
            if (found) return makeRecord(found, rowGb);
          }
          return null;
        }).find(Boolean);
        if (match) records.push({
          sheet: sheetName,
          ...match,
          revTotal: row[revColumn] ?? "",
          revMonths: revMonthColumns.map((column) => column >= 0 ? (row[column] ?? 0) : 0)
        });
      });
    });
    if (!records.length) throw new Error("Tidak ditemukan baris TOTAL (GB, Existing GB, atau New Product GB) dengan kolom REV TOTAL.");
    return records;
  }

  // Target Revenue berisi subtotal bulanan per GB dan kategori.
  // Kategori dibaca dari baris subtotal agar sumber bisa tetap memakai
  // ejaan "NOPEMBER"; urutan bulan mengikuti kolom Jan–Des pada workbook.
  async function processTargetRevenue(file) {
    if (!window.XLSX) throw new Error("Komponen pembaca spreadsheet gagal dimuat.");
    const workbook = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: false });
    const rows = [];
    let sourceYear = null;
    const monthNames = ["JANUARI", "FEBRUARI", "MARET", "APRIL", "MEI", "JUNI", "JULI", "AGUSTUS", "SEPTEMBER", "OKTOBER", "NOVEMBER", "DESEMBER"];
    workbook.SheetNames.forEach((sheetName) => {
      const sheet = workbook.Sheets[sheetName];
      const grid = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: true });
      const flat = grid.flat().map((value) => String(value == null ? "" : value).trim());
      const title = flat.find((value) => /REKAP\s+REVENUE\s+PER\s+PRODUCT\s+TAHUN\s+\d{4}/i.test(value));
      if (title) sourceYear = Number((title.match(/(20\d{2})/) || [])[1]) || sourceYear;
      const headerRow = grid.findIndex((row) => row.some((value) => monthNames.includes(String(value).trim().toUpperCase().replace(/^NOPEMBER$/, "NOVEMBER"))));
      if (headerRow < 0) return;
      const headers = grid[headerRow].map((value) => String(value).trim().toUpperCase().replace(/^NOPEMBER$/, "NOVEMBER"));
      const monthColumns = monthNames.map((name) => headers.indexOf(name));
      if (monthColumns.some((column) => column < 0)) return;

      let gb = null;
      grid.forEach((row) => {
        const cells = row.map((value) => String(value == null ? "" : value).trim());
        const group = cells.map((value) => value.match(/^GB\s*(\d+)$/i)).find(Boolean);
        if (group) gb = Number(group[1]);
        const category = cells.map((value) => value.match(/^KATEGORI\s*([ABCD])$/i)).find(Boolean);
        const nonTarget = cells.some((value) => /^NON\s+TARGET$/i.test(value));
        if (!gb || (!category && !nonTarget)) return;
        const months = monthColumns.map((column) => {
          const value = row[column];
          const number = typeof value === "number" ? value : Number(String(value).replace(/,/g, ""));
          return Number.isFinite(number) ? number : 0;
        });
        const code = nonTarget ? "nonTarget" + gb : "category" + gb + category[1].toUpperCase();
        rows.push({ code, months, fullYear: months.reduce((sum, value) => sum + value, 0) });
      });
    });
    if (!rows.some((record) => /^category\d+A$/.test(record.code))) return null;
    const duplicates = new Set();
    rows.forEach((record) => {
      if (duplicates.has(record.code)) throw new Error("Baris " + record.code + " muncul lebih dari sekali pada Target Revenue.");
      duplicates.add(record.code);
    });
    return { sourceYear, rows };
  }

  // Target EDP MNJ memakai baris EXIST/NP per GB dan kolom bulan Jan–Des.
  // Cari header dan baris dari isinya agar posisi baris dapat berubah.
  async function processEdpTarget(file, targetYear) {
    if (!window.XLSX) throw new Error("Komponen pembaca spreadsheet gagal dimuat.");
    const workbook = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: false });
    const months = [
      ["JANUARI", "JAN"], ["FEBRUARI", "FEB"], ["MARET", "MAR"], ["APRIL", "APR"],
      ["MEI", "MAY"], ["JUNI", "JUN"], ["JULI", "JUL"], ["AGUSTUS", "AGT", "AGU", "AUG"],
      ["SEPTEMBER", "SEP"], ["OKTOBER", "OKT", "OCT"], ["NOVEMBER", "NOV"], ["DESEMBER", "DES", "DEC"]
    ];
    const rowsByCode = new Map();
    let foundEdpLayout = false;
    const norm = (value) => String(value == null ? "" : value).trim().toUpperCase().replace(/\s+/g, " ");
    workbook.SheetNames.forEach((sheetName) => {
      const grid = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: "", raw: true });
      const titleRows = [];
      grid.forEach((row, index) => {
        const title = row.map(norm).find((cell) => /^(?:REVENUE|BIAYA)\s+TAHUN\s+20\d{2}$/.test(cell));
        if (title) titleRows.push({ index, title });
      });
      // Jika workbook memiliki judul section, proses hanya blok REVENUE.
      // Pada workbook tanpa judul section, tetap dukung sheet target sederhana.
      const revenueBlocks = titleRows.length
        ? titleRows.filter((item) => item.title === "REVENUE TAHUN " + targetYear).map((item) => {
          const nextTitle = titleRows.find((candidate) => candidate.index > item.index);
          return grid.slice(item.index + 1, nextTitle ? nextTitle.index : grid.length);
        })
        : [grid];
      if (titleRows.some((item) => item.title.startsWith("REVENUE ")) && !revenueBlocks.length) {
        throw new Error("Blok REVENUE TAHUN " + targetYear + " tidak ditemukan pada file.");
      }
      revenueBlocks.forEach((block) => {
        let monthColumns = null;
        for (const row of block) {
          const headers = row.map(norm);
          const columns = months.map((aliases) => headers.findIndex((header) => aliases.includes(header)));
          if (columns.every((column) => column >= 0)) { monthColumns = columns; break; }
        }
        if (!monthColumns) return;
        let hasEdpRows = false;
        block.forEach((row) => {
        const labels = row.map(norm);
        let match = null;
        for (const label of labels) {
          match = label.match(/^(?:EXIST|EXISTING)\s+GB\s*(\d+)$/i);
          if (match) { match = { gb: match[1], kind: "existing" }; break; }
          match = label.match(/^(?:NP|NEW\s+PRODUCT)\s+GB\s*(\d+)$/i);
          if (match) { match = { gb: match[1], kind: "new" }; break; }
        }
        if (!match) return; // Baris TOTAL sengaja diabaikan supaya tidak ganda.
        hasEdpRows = true;
        const code = (match.kind === "existing" ? "existing" : "new") + match.gb;
        const values = monthColumns.map((column) => {
          const value = row[column];
          if (typeof value === "number" && Number.isFinite(value)) return value;
          const parsed = Number(String(value == null ? "" : value).replace(/,/g, "").trim());
          return String(value == null ? "" : value).trim() !== "" && Number.isFinite(parsed) ? parsed : 0;
        });
        if (rowsByCode.has(code)) throw new Error("Baris target " + code + " muncul lebih dari sekali.");
        rowsByCode.set(code, { code, months: values });
        });
        foundEdpLayout = foundEdpLayout || hasEdpRows;
      });
    });
    if (!foundEdpLayout) return null;
    const rows = Array.from(rowsByCode.values());
    if (![1, 2, 3, 4, 5, 6].every((gb) => rowsByCode.has("existing" + gb) && rowsByCode.has("new" + gb))) {
      throw new Error("Target EDP MNJ harus memuat baris EXIST GB dan NP GB untuk GB 1 sampai 6.");
    }
    if (!rows.some((record) => record.months.some((value) => value !== 0))) {
      throw new Error("Nilai target bulanan tidak ditemukan pada baris EXIST/NP GB.");
    }
    return { year: Number(targetYear), rows };
  }

  // TARGET SELL OUT can appear anywhere in a workbook and its YTD column
  // changes month as the year progresses. Read the month columns by label and
  // use only the block under the matching TARGET SELL OUT YYYY heading.
  async function processSellOutTarget(file) {
    if (!window.XLSX) throw new Error("Komponen pembaca spreadsheet gagal dimuat.");
    const workbook = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: false });
    const monthAliases = [
      ["JANUARI", "JAN"], ["FEBRUARI", "FEB"], ["MARET", "MAR"], ["APRIL", "APR"],
      ["MEI", "MAY"], ["JUNI", "JUN"], ["JULI", "JUL"], ["AGUSTUS", "AGT", "AGU", "AUG"],
      ["SEPTEMBER", "SEP"], ["OKTOBER", "OKT", "OCT"], ["NOVEMBER", "NOV"], ["DESEMBER", "DES", "DEC"]
    ];
    const norm = (value) => String(value == null ? "" : value).trim().toUpperCase().replace(/\s+/g, " ");
    const rowsByCode = new Map();
    let foundTitle = false;
    let sourceYear = null;
    workbook.SheetNames.forEach((sheetName) => {
      const grid = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: "", raw: true });
      grid.forEach((row, titleIndex) => {
        const title = row.map(norm).find((cell) => /^TARGET\s+SELL\s+OUT\s+20\d{2}$/.test(cell));
        if (!title) return;
        foundTitle = true;
        const year = Number((title.match(/(20\d{2})/) || [])[1]);
        let end = grid.length;
        for (let i = titleIndex + 1; i < grid.length; i++) {
          if (grid[i].map(norm).some((cell) => /^(?:TARGET\s+SELL\s+OUT|REVENUE|BIAYA|MCM)\s+(?:TAHUN\s+)?20\d{2}$/.test(cell))) { end = i; break; }
        }
        let monthColumns = null;
        let productColumn = -1;
        let headerIndex = -1;
        for (let i = titleIndex + 1; i < end; i++) {
          const headers = grid[i].map(norm);
          const columns = monthAliases.map((aliases) => headers.findIndex((header) => aliases.includes(header)));
          if (columns.every((column) => column >= 0)) {
            monthColumns = columns;
            headerIndex = i;
            productColumn = headers.findIndex((header) => /^(PRODUK|PRODUCT)$/.test(header));
            break;
          }
        }
        if (!monthColumns) return;
        sourceYear = year;
        for (let i = headerIndex + 1; i < end; i++) {
          const row = grid[i];
          const labels = row.map(norm);
          const label = productColumn >= 0 ? labels[productColumn] : labels.find((cell) => /^(?:EXIST(?:ING)?|NP|NEW\s+PRODUCT)\s+GB\s*\d+$/.test(cell));
          const match = String(label || "").match(/^(EXIST(?:ING)?|NP|NEW\s+PRODUCT)\s+GB\s*(\d+)$/);
          if (!match) continue;
          const code = /^(?:EXIST|EXISTING)$/.test(match[1]) ? "existing" + match[2] : "new" + match[2];
          if (rowsByCode.has(code)) throw new Error("Baris target " + code + " muncul lebih dari sekali pada TARGET SELL OUT " + year + ".");
          const months = monthColumns.map((column) => {
            const value = row[column];
            if (typeof value === "number" && Number.isFinite(value)) return value;
            const parsed = Number(String(value == null ? "" : value).replace(/,/g, "").trim());
            return String(value == null ? "" : value).trim() !== "" && Number.isFinite(parsed) ? parsed : 0;
          });
          rowsByCode.set(code, { code, months });
        }
      });
    });
    if (!foundTitle) return null;
    if (!sourceYear || ![1, 2, 3, 4, 5, 6].every((gb) => rowsByCode.has("existing" + gb) && rowsByCode.has("new" + gb))) {
      throw new Error("TARGET SELL OUT harus memiliki EXIST GB dan NP GB 1–6 serta kolom Januari–Desember.");
    }
    if (!Array.from(rowsByCode.values()).some((record) => record.months.some((value) => value !== 0))) {
      throw new Error("Nilai bulanan tidak ditemukan pada TARGET SELL OUT " + sourceYear + ".");
    }
    return { year: sourceYear, rows: Array.from(rowsByCode.values()) };
  }

  async function processRevenueUpload(file) {
    const sellOutTarget = await processSellOutTarget(file);
    if (sellOutTarget) return { type: "target", ...sellOutTarget };
    const target = await processTargetRevenue(file);
    if (target) return { type: "target", ...target };
    return { type: "achievement", rows: await processRevenueSO(file) };
  }

  // Validasi file: ekstensi + ukuran
  function validate(f) {
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    if (f.name.indexOf(".") < 0 || !ALLOWED.includes(ext))
      return "Format file tidak didukung. Gunakan file .xlsx atau .ods.";
    if (f.size === 0) return "File kosong. Pilih file lain.";
    if (f.size > MAX_MB * 1024 * 1024) return "Ukuran file melebihi " + MAX_MB + "MB (" + fmtSize(f.size) + ").";
    return "";
  }

  function pick(f) {
    if (!f || busy) return;
    const err = validate(f);
    if (err) { clearFile(); drop.classList.add("err"); setMsg(err, "error"); return; }
    chosen = f;
    $("fname").textContent = f.name;
    $("fsize").textContent = fmtSize(f.size);
    drop.classList.remove("err");
    drop.classList.add("has-file");
    setMsg("");
  }
  function clearFile() {
    chosen = null;
    fileInput.value = "";
    drop.classList.remove("has-file");
  }

  // Klik / keyboard pada dropzone
  drop.addEventListener("click", (e) => {
    if (busy || e.target.closest("#rm")) return;
    fileInput.click();
  });
  drop.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && e.target === drop) { e.preventDefault(); if (!busy) fileInput.click(); }
  });
  fileInput.addEventListener("change", () => pick(fileInput.files[0]));
  $("rm").addEventListener("click", (e) => { e.stopPropagation(); if (!busy) { clearFile(); setMsg(""); } });

  // Drag & drop
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); if (!busy) drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => {
    const files = e.dataTransfer.files;
    if (files.length > 1) { setMsg("Hanya satu file yang bisa diunggah sekaligus.", "error"); return; }
    pick(files[0]);
  });
  // Cegah browser membuka file bila dijatuhkan di luar dropzone
  ["dragover", "drop"].forEach((ev) => window.addEventListener(ev, (e) => e.preventDefault()));

  function setBusy(on) {
    busy = on;
    btn.disabled = on;
    btnText.textContent = on ? "Mengunggah..." : "Upload File";
    bar.classList.toggle("on", on);
    if (!on) barFill.style.width = "0";
  }

  // Simpan lokal pada file://, atau kirim ke endpoint PHP saat dijalankan lewat web.
  function send(divisi, file, period) {
    return new Promise((resolve, reject) => {
      if (LOCAL_FILE_MODE) {
        if (divisi !== "Revenue Konimex Selling Out" && divisi !== "REVENUE VERSI EDP MNJ") {
          reject(new Error("Mode file:// saat ini mendukung upload Revenue Konimex Selling Out dan Revenue Versi EDP MNJ."));
          return;
        }
        resolve({ success: true, local: true });
        return;
      }
      if (!UPLOAD_URL) { // mode demo
        let p = 0;
        const t = setInterval(() => {
          p += 12 + Math.random() * 10;
          barFill.style.width = Math.min(p, 100) + "%";
          if (p >= 100) { clearInterval(t); resolve(); }
        }, 120);
        return;
      }
      const fd = new FormData();
      fd.append("divisi", divisi);
      // Sertakan nama file secara eksplisit agar server selalu menerima part
      // multipart sebagai $_FILES['file'], termasuk browser tertentu.
      fd.append("file", file, file.name);
      fd.append("period", period);
      const xhr = new XMLHttpRequest();
      const endpoint = new URL(UPLOAD_URL, location.href);
      // Kirim periode juga di URL. Jika server melakukan redirect POST menjadi
      // GET, PHP tetap dapat mengecek duplikasi periode sebelum memeriksa file.
      endpoint.searchParams.set("period", period);
      xhr.open("POST", endpoint.href);
      xhr.upload.onprogress = (e) => { if (e.lengthComputable) barFill.style.width = (e.loaded / e.total * 100) + "%"; };
      xhr.onload = () => {
        let result = null;
        try { result = JSON.parse(xhr.responseText); } catch (_) { /* respons non-JSON */ }
        if (xhr.status >= 200 && xhr.status < 300 && result && result.success === true) {
          resolve(result);
          return;
        }
        const detail = result && result.message ? result.message : "Server mengembalikan respons yang tidak valid.";
        reject(new Error(xhr.status ? detail + " (HTTP " + xhr.status + ")." : detail));
      };
      xhr.onerror = () => reject(new Error("Tidak dapat mengakses " + new URL(UPLOAD_URL, location.href).href + ". Pastikan server PHP aktif dan halaman dibuka dari server yang sama."));
      xhr.ontimeout = () => reject(new Error("Upload melewati batas waktu. Periksa koneksi dan batas ukuran upload server."));
      xhr.timeout = 120000;
      xhr.send(fd);
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (busy) return;
    setMsg("");
    $("bagianWrap").classList.remove("err");
    drop.classList.remove("err");

    const validSection = sectionOptions.includes(sectionSelect.value);
    if (!validSection) { $("bagianWrap").classList.add("err"); setMsg("Ketik lalu pilih bagian laporan yang tersedia.", "error"); sectionSelect.focus(); return; }
    if (!periodSelect.value) { setMsg("Pilih periode laporan terlebih dahulu.", "error"); periodSelect.focus(); return; }
    if (!chosen) { drop.classList.add("err"); setMsg("Pilih file dokumen terlebih dahulu.", "error"); return; }
    setBusy(true);
    try {
      const isRevenueSO = sectionSelect.value === "Revenue Konimex Selling Out";
      const isTargetSection = sectionSelect.value.toUpperCase() === "TARGET REVENUE";
      const isEdpMnjRevenue = sectionSelect.value === "REVENUE VERSI EDP MNJ";
      const isEdpMnjTarget = sectionSelect.value === "REVENUE VERSI EDP MNJ Target";
      if (LOCAL_FILE_MODE && !isRevenueSO && !isEdpMnjRevenue && !isEdpMnjTarget && !isTargetSection) {
        throw new Error("Mode file:// saat ini mendukung upload Revenue Konimex Selling Out dan Target Revenue.");
      }
      const selectedYear = Number(periodSelect.value.slice(0, 4));
      const edpTarget = isEdpMnjTarget ? await processEdpTarget(chosen, selectedYear) : null;
      const processed = edpTarget
        ? { type: "target", ...edpTarget }
        : isTargetSection
        ? await processRevenueUpload(chosen).then((target) => target && target.type === "target" ? target : null)
        : (isRevenueSO || isEdpMnjRevenue) ? await processRevenueUpload(chosen) : null;
      const isTarget = processed && processed.type === "target";
      if ((isTargetSection || isEdpMnjTarget) && !isTarget) {
        throw new Error(isEdpMnjTarget
          ? "Target EDP MNJ tidak dikenali. Pastikan blok REVENUE TAHUN " + selectedYear + " memiliki baris EXIST GB dan NP GB 1–6 serta kolom Januari–Desember."
          : "File tidak dikenali sebagai Target Revenue. Gunakan workbook target dengan subtotal Kategori A–D.");
      }
      const processedRows = processed && processed.rows;
      const period = periodSelect.value;
      const targetStorageYear = isTarget && Number.isInteger(Number(processed.year))
        ? Number(processed.year)
        : Number(period.slice(0, 4));
      if (isTarget && processed.sourceYear && String(processed.sourceYear) !== period.slice(0, 4)) {
        throw new Error("Tahun pada file Target Revenue (" + processed.sourceYear + ") berbeda dari periode yang dipilih (" + period.slice(0, 4) + ").");
      }
      if (isEdpMnjTarget && targetStorageYear !== selectedYear) {
        throw new Error("Tahun target EDP MNJ pada file (" + targetStorageYear + ") berbeda dari tahun periode yang dipilih (" + selectedYear + ").");
      }
      if (LOCAL_FILE_MODE && !isTarget) {
        let history = {};
        try { history = JSON.parse(localStorage.getItem(PROCESSED_KEY) || "{}"); } catch (_) { history = {}; }
        history[period] = { period, source: chosen.name, processedAt: new Date().toISOString(), rows: processedRows };
        try {
          localStorage.setItem(PROCESSED_KEY, JSON.stringify(history));
        } catch (_) {
          throw new Error("Browser tidak mengizinkan penyimpanan lokal. Buka halaman ini di Chrome atau Edge, lalu izinkan penyimpanan situs untuk file lokal.");
        }
      }
      if (!isTarget) await send(sectionSelect.value, chosen, period);
      if (isTarget) {
        if (!isEdpMnjTarget) {
          let history = {};
          try { history = JSON.parse(localStorage.getItem(TARGET_KEY) || "{}"); } catch (_) { history = {}; }
          history[String(targetStorageYear)] = { year: targetStorageYear, source: chosen.name, processedAt: new Date().toISOString(), rows: processedRows };
          try { localStorage.setItem(TARGET_KEY, JSON.stringify(history)); } catch (_) { /* API menyimpan data lintas halaman */ }
          let sellOutTargets = {};
          try { sellOutTargets = JSON.parse(localStorage.getItem(SELL_OUT_TARGET_KEY) || "{}"); } catch (_) { sellOutTargets = {}; }
          sellOutTargets[String(targetStorageYear)] = { year: targetStorageYear, source: chosen.name, processedAt: new Date().toISOString(), rows: processedRows };
          try { localStorage.setItem(SELL_OUT_TARGET_KEY, JSON.stringify(sellOutTargets)); } catch (_) { /* target API remains available to other reports */ }
        }
        let response;
        try {
          response = await fetch(isEdpMnjTarget ? EDP_MNJ_TARGET_API_URL : TARGET_API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ year: targetStorageYear, month: Number(period.slice(5, 7)), source: chosen.name, processedAt: new Date().toISOString(), rows: processedRows })
          });
        } catch (_) {
          throw new Error(isEdpMnjTarget
            ? "Server/database belum terhubung. Target EDP MNJ belum tersimpan di revenue_edp_mnj_target."
            : "Server lokal belum terhubung. Jalankan aplikasi lewat http://127.0.0.1:8000 agar data Target Revenue dapat dipakai di halaman Dashboard.");
        }
        const result = response ? await response.json().catch(() => null) : null;
        if (response && (!response.ok || !result || result.success !== true)) {
          throw new Error(result && result.message ? result.message : (isEdpMnjTarget
            ? "Target EDP MNJ gagal disimpan ke revenue_edp_mnj_target."
            : "Target tersimpan di halaman Upload, tetapi belum bisa dibagikan ke Dashboard. Buka aplikasi melalui server lokal dan unggah ulang."));
        }
      } else if (processedRows && !LOCAL_FILE_MODE) {
        let history = {};
        try { history = JSON.parse(localStorage.getItem(PROCESSED_KEY) || "{}"); } catch (_) { history = {}; }
        history[periodSelect.value] = { period: periodSelect.value, source: chosen.name, processedAt: new Date().toISOString(), rows: processedRows };
        localStorage.setItem(PROCESSED_KEY, JSON.stringify(history));
      }
      barFill.style.width = "100%";
      setMsg(isTarget
          ? isEdpMnjTarget
            ? "Target EDP MNJ " + targetStorageYear + " berhasil disimpan ke database revenue_edp_mnj_target."
            : "Target Sell Out " + targetStorageYear + " berhasil disimpan dan siap diunduh dari halaman Revenue Konimex Selling Out (RP)."
          : LOCAL_FILE_MODE
            ? "Berhasil: \"" + chosen.name + "\" diproses dan disimpan di browser untuk periode " + period + "."
            : isEdpMnjRevenue
              ? "Berhasil: data REV EDP MNJ tersimpan di database revenue_edp_mnj untuk periode " + period + " dan siap dipakai pada unduhan Revenue Konimex Selling Out."
              : "Berhasil: \"" + chosen.name + "\" terkirim pada bagian " + sectionSelect.value + (UPLOAD_URL ? "." : " (mode demo)."), "ok");
      clearFile();
      sectionSelect.value = "";
    } catch (err) {
      setMsg(err.message || "Upload gagal. Coba lagi.", "error");
    } finally {
      setBusy(false);
    }
  });
  $("clearLocal").addEventListener("click", () => {
    if (!window.confirm("Hapus data Achievement dan Target Revenue Selling Out yang tersimpan di browser ini?")) return;
    localStorage.removeItem(PROCESSED_KEY);
    localStorage.removeItem(TARGET_KEY);
    localStorage.removeItem(SELL_OUT_TARGET_KEY);
    setMsg("Data laporan yang tersimpan di browser sudah dihapus.", "ok");
  });
</script>
