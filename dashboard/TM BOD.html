<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TM BOD - Laporan Korporat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --side: #4a3bd4; --side-active: #3a2f9e; --head: #9b8cff; --tabbar: #dcd8ff; --green: #14b87c; --ink: #111; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Inter', sans-serif; color: var(--ink); background: #fff; display: grid; grid-template-columns: 226px 1fr; overflow: hidden; }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }

  /* ===== Sidebar ===== */
  aside { background: var(--side); height: 100vh; overflow-y: auto; color: #fff; padding-bottom: 24px; }
  .logo { display: inline-flex; align-items: flex-start; gap: 2px; margin: 36px 0 28px 24px; font-weight: 700; font-style: italic; font-size: 31px; letter-spacing: -1px; color: #e31e24; text-decoration: none; }
  .logo svg { width: 22px; height: 22px; margin-top: -6px; }
  .sec { display: flex; align-items: center; gap: 22px; width: 176px; height: 52px; margin: 0 0 18px 23px; padding-left: 28px; border: 0; border-radius: 8px; background: var(--green); color: #fff; font-size: 13px; box-shadow: 0 3px 6px rgba(0,0,0,.25); }
  .sec svg { width: 22px; height: 22px; flex-shrink: 0; }
  .sec.on { box-shadow: 0 0 0 3px rgba(255,255,255,.55), 0 3px 6px rgba(0,0,0,.25); }
  nav { margin-top: 26px; }
  nav button { display: block; width: 100%; text-align: left; padding: 14px 14px; border: 0; background: transparent; color: #fff; font-size: 12.5px; line-height: 1.25; }
  nav button:hover { background: rgba(255,255,255,.1); }
  nav button.on { background: var(--side-active); }

  /* ===== Konten utama ===== */
  main { height: 100vh; overflow-y: auto; position: relative; }
  .head { background: var(--head); padding: 28px 32px 22px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .head h1 { font-size: 23px; font-weight: 600; }
  .head h2 { font-size: 23px; font-weight: 600; margin-top: 16px; }
  .ctrl { display: flex; gap: 14px; align-items: center; margin-right: 8px; }
  .pill { height: 32px; border: 1.5px solid #2a6bff; border-radius: 10px; background: #fff; padding: 0 14px; font-size: 13px; display: flex; align-items: center; gap: 28px; color: var(--ink); }
  .pill svg { width: 20px; height: 20px; }
  .period { position: relative; }
  .period select { height: 32px; width: 138px; appearance: none; -webkit-appearance: none; border: 1.5px solid #333; border-radius: 10px; background: #fff; padding: 0 34px 0 22px; font-family: inherit; font-size: 13px; }
  .period svg { position: absolute; right: 12px; top: 9px; width: 16px; height: 16px; pointer-events: none; }

  .dots { position: absolute; top: 12px; right: 18px; }
  .dots > button { border: 0; background: none; font-size: 22px; line-height: 1; padding: 4px 8px; font-weight: 700; }
  .menu { display: none; position: absolute; right: 0; top: 34px; background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.25); min-width: 150px; overflow: hidden; z-index: 5; }
  .menu.open { display: block; }
  .menu a { display: block; padding: 10px 14px; font-size: 13px; color: var(--ink); text-decoration: none; }
  .menu a:hover { background: #f1efff; }
  .burger { display: inline-flex; align-items: center; gap: 7px; margin: 0 0 10px; border: 1px solid #cfcaf5; border-radius: 9px; background: #fff; color: #111; padding: 7px 11px; font-size: 13px; font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,.12); }

  .tabs { user-select: none; -webkit-user-select: none; background: var(--tabbar); display: flex; gap: 8px; padding: 6px 14px 0; overflow-x: auto; }
  .tabs button { flex: 1 0 auto; border: 0; background: transparent; padding: 11px 20px; font-size: 13px; border-radius: 6px 6px 0 0; white-space: nowrap; }
  .tabs button:hover { background: rgba(255,255,255,.5); }
  .tabs button.on { background: #fff; }

  .body { padding: 10px 20px 48px; }
  .cards { user-select: none; -webkit-user-select: none; display: flex; gap: 22px; overflow-x: auto; padding: 8px 8px 22px; }
  .kpi { flex: 0 0 205px; min-height: 125px; background: #fff; border-radius: 28px; padding: 18px 12px 16px 12px; box-shadow: 0 4px 8px rgba(0,0,0,.22); }
  .kpi p { font-size: 13px; line-height: 1.2; min-height: 32px; }
  .kpi b { display: block; margin-top: 12px; font-size: 25px; font-weight: 500; }

  .subs { display: flex; gap: 40px; margin: 22px 0 10px 30px; }
  .subs span { font-size: 13px; font-weight: 700; padding: 4px 0; border-bottom: 2px solid var(--side); }
  /* Sembunyikan scrollbar (tetap bisa di-scroll) */
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; }
  .chartcard { background: #fff; border-radius: 28px; box-shadow: 0 4px 8px rgba(0,0,0,.22); padding: 22px; margin: 0 8px; max-width: 760px; min-height: 220px; }
  .chart-tools { display: flex; justify-content: flex-end; max-width: 760px; margin: 0 8px 10px; }
  .chart-download { height: 34px; border: 1px solid #cfcaf5; border-radius: 10px; background: #fff; color: #111; padding: 0 13px; font-size: 12px; font-weight: 400; }
  .chart-download:hover { background: #f8f7ff; }
  .empty { display: grid; place-items: center; min-height: 176px; text-align: center; font-size: 12.5px; color: #6b7280; border: 2px dashed #d6d3ee; border-radius: 18px; padding: 16px; }
  .chartcard svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px; margin-top: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; }

  /* ===== Analisis & catatan ===== */
  .analysis { margin: 44px 8px 0; max-width: 760px; background: #f6f5ff; border-radius: 22px; padding: 22px; }
  .analysis h3, .notes h3 { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  textarea { width: 100%; min-height: 130px; resize: vertical; border: 1.5px solid #cfcaf5; border-radius: 12px; padding: 12px 14px; font-family: inherit; font-size: 13px; background: #fff; }
  .acts { display: flex; justify-content: flex-end; gap: 12px; margin-top: 14px; }
  .btn { height: 36px; padding: 0 26px; border-radius: 10px; font-size: 13px; font-weight: 600; }
  .btn.cancel { border: 1.5px solid #9ca3af; background: #fff; color: #374151; }
  .btn.save { border: 0; background: var(--green); color: #fff; }
  .notes { margin: 28px 8px 0; max-width: 760px; }
  .note { background: #fff; border: 1px solid #e5e3f7; border-left: 5px solid var(--side); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,.06); }
  .note p { font-size: 13px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 11px; color: #6b7280; }
  .note footer button { border: 0; background: none; color: #c62828; font-size: 11px; }
  .none { font-size: 12.5px; color: #6b7280; }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1f2430; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: .2s; z-index: 20; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  /* ===== Responsif ===== */
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; }
    aside { position: fixed; z-index: 10; width: 250px; transform: translateX(-100%); transition: transform .2s; }
    aside.open { transform: none; }
    .head { padding-top: 52px; }
    .ctrl { flex-wrap: wrap; margin-right: 0; }
    }

  nav a { display:block; width:100%; text-align:left; padding:14px; color:#fff; font-size:12.5px; line-height:1.25; text-decoration:none; }
  nav a:hover { background:rgba(255,255,255,.1); }
  .summary-bar { min-height:46px; align-items:flex-end; }
  .summary-bar span { display:block; background:#fff; padding:11px 20px; border-radius:6px 6px 0 0; font-size:13px; }
  .analysis { margin-top:24px; }
  .analysis label { display:block; font-size:15px; font-weight:700; margin-bottom:10px; }
  .analysis textarea { min-height:190px; line-height:1.6; color:var(--ink); }
  #status { min-height:18px; margin:12px 8px 0; font-size:12px; color:#6b7280; }
  .menu[hidden] { display:none; }
  .menu:not([hidden]) { display:block; }
  .menu button { display:block; width:100%; text-align:left; padding:10px 14px; font-size:13px; color:var(--ink); border:0; background:#fff; }
  .menu button:hover { background:#f1efff; }
  .pill:disabled { opacity:.6; cursor:wait; }
  @media (max-width:480px) { .head { padding-left:20px; padding-right:20px; } .ctrl { gap:10px; } .pill { gap:14px; } .period select { width:112px; } .body { padding-left:12px; padding-right:12px; } .analysis { padding:18px; } }
</style>
</head>
<body>
<aside id="side">
  <a class="logo" href="../menu/page.html" aria-label="Konimex">KONIMEX
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="6" r="4" fill="#e31e24"/><circle cx="17" cy="9" r="4" fill="#e31e24"/><circle cx="10" cy="16" r="4" fill="#e31e24"/></svg>
  </a>
  <button class="sec off" data-sec="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 3v18M3 12h18"/></svg>Dashboard</button>
  <button class="sec on" data-sec="TM BOD" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 3v18M3 12h18"/></svg>TM BOD</button>
</aside>

<main>
  <div class="dots">
    <button id="more" aria-label="Menu lainnya" aria-haspopup="true" aria-expanded="false" aria-controls="options">&#8942;</button>
    <div class="menu" id="options" hidden>
      <a href="assets/tm-bod/template.odp" download="PPT TM BOD TEMPLATE.odp">Unduh template asli</a>
      <button id="reset" type="button">Kosongkan analisis kuartal ini</button>
    </div>
  </div>
  <section class="head">
    <div>
      <button class="burger" id="burger" type="button" aria-label="Kembali ke halaman menu"><span aria-hidden="true">&#9776;</span> Menu</button>
      <h1>TM BOD</h1>
    </div>
    <div class="ctrl">
      <button class="pill" id="download" disabled>Unduh Data
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" fill="#000"/><path d="M12 7v8M8.5 12l3.5 3.5 3.5-3.5" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="period">
        <select id="quarter" aria-label="Kuartal laporan"><option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option></select>
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
      </div>
    </div>
  </section>
  <div class="body">
    <section class="analysis" aria-label="Analisis TM BOD">
      <label for="analysis">Analisis</label>
      <textarea id="analysis" maxlength="3000" placeholder="Tulis analisis atau catatan untuk TM BOD..." spellcheck="false"></textarea>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </div>
</main>
<script src="tm-bod.js"></script>
</body>
</html>
