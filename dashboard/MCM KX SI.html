<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - Laporan Korporat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --side: #4a3bd4; --side-active: #3a2f9e; --head: #9b8cff; --tabbar: #dcd8ff; --green: #14b87c; --ink: #111; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Inter', sans-serif; color: var(--ink); background: #fff; display: grid; grid-template-columns: 226px 1fr; overflow: hidden; }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }

  /* ===== Sidebar ===== */
  aside { background: var(--side); height: 100vh; overflow-y: auto; color: #fff; padding-bottom: 24px; }
  .logo { display: inline-flex; align-items: flex-start; gap: 2px; margin: 36px 0 28px 24px; font-weight: 700; font-style: italic; font-size: 31px; letter-spacing: -1px; color: #e31e24; text-decoration: none; }
  .logo svg { width: 22px; height: 22px; margin-top: -6px; }
  .sec { display: flex; align-items: center; gap: 22px; width: 176px; height: 52px; margin: 0 0 18px 23px; padding-left: 28px; border: 0; border-radius: 8px; background: var(--green); color: #fff; font-size: 13px; box-shadow: 0 3px 6px rgba(0,0,0,.25); }
  .sec svg { width: 22px; height: 22px; flex-shrink: 0; }
  .sec.on { box-shadow: 0 0 0 3px rgba(255,255,255,.55), 0 3px 6px rgba(0,0,0,.25); }
  nav { margin-top: 26px; }
  nav button { display: block; width: 100%; text-align: left; padding: 14px 14px; border: 0; background: transparent; color: #fff; font-size: 12.5px; line-height: 1.25; }
  nav button:hover { background: rgba(255,255,255,.1); }
  nav button.on { background: var(--side-active); }

  /* ===== Konten utama ===== */
  main { height: 100vh; overflow-y: auto; position: relative; }
  .head { background: var(--head); padding: 28px 32px 22px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .head h1 { font-size: 23px; font-weight: 600; }
  .head h2 { font-size: 23px; font-weight: 600; margin-top: 16px; }
  .ctrl { display: flex; gap: 14px; align-items: center; margin-right: 8px; }
  .pill { height: 32px; border: 1.5px solid #2a6bff; border-radius: 10px; background: #fff; padding: 0 14px; font-size: 13px; display: flex; align-items: center; gap: 28px; color: var(--ink); }
  .pill svg { width: 20px; height: 20px; }
  .period { position: relative; }
  .period select { height: 32px; width: 138px; appearance: none; -webkit-appearance: none; border: 1.5px solid #333; border-radius: 10px; background: #fff; padding: 0 34px 0 22px; font-family: inherit; font-size: 13px; }
  .period svg { position: absolute; right: 12px; top: 9px; width: 16px; height: 16px; pointer-events: none; }

  .dots { position: absolute; top: 12px; right: 18px; }
  .dots > button { border: 0; background: none; font-size: 22px; line-height: 1; padding: 4px 8px; font-weight: 700; }
  .menu { display: none; position: absolute; right: 0; top: 34px; background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.25); min-width: 150px; overflow: hidden; z-index: 5; }
  .menu.open { display: block; }
  .menu a { display: block; padding: 10px 14px; font-size: 13px; color: var(--ink); text-decoration: none; }
  .menu a:hover { background: #f1efff; }
  .burger { display: inline-flex; align-items: center; gap: 7px; margin: 0 0 10px; border: 1px solid #cfcaf5; border-radius: 9px; background: #fff; color: #111; padding: 7px 11px; font-size: 13px; font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,.12); }

  .tabs { user-select: none; -webkit-user-select: none; background: var(--tabbar); display: flex; gap: 8px; padding: 6px 14px 0; overflow-x: auto; }
  .tabs button { flex: 1 0 auto; border: 0; background: transparent; padding: 11px 20px; font-size: 13px; border-radius: 6px 6px 0 0; white-space: nowrap; }
  .tabs button:hover { background: rgba(255,255,255,.5); }
  .tabs button.on { background: #fff; }

  .body { padding: 10px 20px 48px; }
  .cards { user-select: none; -webkit-user-select: none; display: flex; gap: 22px; overflow-x: auto; padding: 8px 8px 22px; }
  .kpi { flex: 0 0 205px; min-height: 125px; background: #fff; border-radius: 28px; padding: 18px 12px 16px 12px; box-shadow: 0 4px 8px rgba(0,0,0,.22); }
  .kpi p { font-size: 13px; line-height: 1.2; min-height: 32px; }
  .kpi b { display: block; margin-top: 12px; font-size: 25px; font-weight: 500; }

  .subs { display: flex; gap: 40px; margin: 22px 0 10px 30px; }
  .subs span { font-size: 13px; font-weight: 700; padding: 4px 0; border-bottom: 2px solid var(--side); }
  /* Sembunyikan scrollbar (tetap bisa di-scroll) */
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; }
  .chartcard { background: #fff; border-radius: 28px; box-shadow: 0 4px 8px rgba(0,0,0,.22); padding: 22px; margin: 0 8px; max-width: 760px; min-height: 220px; }
  .empty { display: grid; place-items: center; min-height: 176px; text-align: center; font-size: 12.5px; color: #6b7280; border: 2px dashed #d6d3ee; border-radius: 18px; padding: 16px; }
  .chartcard svg { width: 100%; height: auto; display: block; }
  .chartcard { position: relative; }
  .mcm-bar, .mcm-legend { transition: opacity .18s ease; }
  .mcm-bar { cursor: pointer; }
  .mcm-bar:focus-visible { outline: none; stroke: #26243d; stroke-width: 2; }
  .chartcard.has-bar-focus .mcm-bar:not(.is-active),
  .chartcard.has-bar-focus .mcm-legend:not(.is-active) { opacity: .22; }
  .mcm-tooltip { position: absolute; z-index: 2; pointer-events: none; max-width: calc(100% - 24px); padding: 11px 14px; border-radius: 10px; background: #242331; color: #fff; box-shadow: 0 5px 18px #0002; font-size: 12px; line-height: 1.6; }
  .mcm-tooltip strong { display: block; font-size: 15px; }
  @media (prefers-reduced-motion: reduce) { .mcm-bar, .mcm-legend { transition: none; } }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px; margin-top: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; }

  /* ===== Analisis & catatan ===== */
  .analysis { margin: 44px 8px 0; max-width: 760px; background: #f6f5ff; border-radius: 22px; padding: 22px; }
  .analysis h3, .notes h3 { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  textarea { width: 100%; min-height: 130px; resize: vertical; border: 1.5px solid #cfcaf5; border-radius: 12px; padding: 12px 14px; font-family: inherit; font-size: 13px; background: #fff; }
  .acts { display: flex; justify-content: flex-end; gap: 12px; margin-top: 14px; }
  .btn { height: 36px; padding: 0 26px; border-radius: 10px; font-size: 13px; font-weight: 600; }
  .btn.cancel { border: 1.5px solid #9ca3af; background: #fff; color: #374151; }
  .btn.save { border: 0; background: var(--green); color: #fff; }
  .notes { margin: 28px 8px 0; max-width: 760px; }
  .note { background: #fff; border: 1px solid #e5e3f7; border-left: 5px solid var(--side); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,.06); }
  .note p { font-size: 13px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 11px; color: #6b7280; }
  .note footer button { border: 0; background: none; color: #c62828; font-size: 11px; }
  .none { font-size: 12.5px; color: #6b7280; }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1f2430; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: .2s; z-index: 20; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  /* ===== Responsif ===== */
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; }
    aside { position: fixed; z-index: 10; width: 250px; transform: translateX(-100%); transition: transform .2s; }
    aside.open { transform: none; }
    .head { padding-top: 52px; }
    .ctrl { flex-wrap: wrap; margin-right: 0; }
    }
  .note-creation-credit { display:block; text-align:right; margin:0 0 8px; padding:0; background:none; border:0; box-shadow:none; height:auto; font-size:11px; font-weight:400; line-height:1.5; color:#6b7280; overflow-wrap:anywhere; }
  .note-edit-credit { display:block; margin-top:4px; font-size:11px; color:#6b7280; }
  .note footer .note-to-tm-bod { padding:5px 9px; border:1px solid #d8d2f4; border-radius:7px; color:#6450bd; font-size:11px; cursor:pointer; }
  .note-to-tm-bod:hover { background:#f0edff; }
  .note-actions { display: inline-flex; align-items: center; gap: 8px; }
  .note-delete { display: inline-flex; align-items: center; justify-content: center; padding: 6px; border-radius: 7px; cursor: pointer; }
  .note-delete:hover { background: #fff0f0; }
  .note-edit { display: inline-flex; align-items: center; justify-content: center; padding: 6px; border-radius: 7px; color: #6450bd; }
  .note-edit:hover { background: #f0edff; }
</style>
</head>
<body>

<aside id="side">
  <a class="logo" href="#" aria-label="Konimex">KONIMEX
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="6" r="4" fill="#e31e24"/><circle cx="17" cy="9" r="4" fill="#e31e24"/><circle cx="10" cy="16" r="4" fill="#e31e24"/></svg>
  </a>
  <button class="sec on" data-sec="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 3v18M3 12h18"/></svg>Dashboard</button>
  <button class="sec off" data-sec="TM BOD"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 3v18M3 12h18"/></svg>TM BOD</button>
  <nav id="menu" aria-label="Daftar laporan"></nav>
</aside>

<main id="main">
  <div class="dots">
    <button id="dotsBtn" aria-label="Menu lainnya" aria-haspopup="true">&#8942;</button>
    <div class="menu" id="dotsMenu">
      <a href="upload.html">Upload File</a>
      <a href="login.html">Keluar</a>
    </div>
  </div>

  <section class="head">
    <div>
      <button class="burger" id="burger" type="button" aria-label="Kembali ke halaman menu"><span aria-hidden="true">&#9776;</span> Menu</button>
      <h1 id="secTitle">Dashboard</h1>
      <h2 id="repTitle"></h2>
    </div>
    <div class="ctrl">
      <button class="pill" id="dl">Unduh Data
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" fill="#000"/><path d="M12 7v8M8.5 12l3.5 3.5 3.5-3.5" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="period">
        <select id="period" aria-label="Periode"></select>
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
      </div>
    </div>
  </section>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="body">
    <div class="cards" id="cards"></div>

    <div class="subs"><span>Ach &amp; Growth</span></div>
    <div class="chartcard" id="chart"></div>

    <section class="analysis">
      <h3>Analisis</h3>
      <textarea id="note" placeholder="Tulis analisis atau catatan untuk laporan ini..." aria-label="Analisis"></textarea>
      <div class="acts">
        <button class="btn cancel" id="cancel" type="button">Batal</button>
        <button class="btn save" id="save" type="button">Simpan</button>
      </div>
    </section>

    <section class="notes">
      <h3>Catatan</h3>

    <div id="notes"></div>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="status"></div>

<script src="report-api-cache.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="report-templates.js?v=revenue-thousands-20261022"></script>
<script src="shared-report-download.js"></script>
<script src="mcm-chart-data.js"></script>
<script src="mcm-chart-interaction.js"></script>
<script src="analysis-store.js"></script>
<script src="analysis-to-tm-bod.js"></script>
<script src="analysis-lock.js"></script>
<script>
  /* ================= PENGATURAN ================= */
  const REPORTS = [
    "Revenue Konimex Selling Out (RP)", "MCM Konimex Sell In (RP)", "Revenue Konimex Selling In (RP)",
    "Ratio Biaya (Biaya vs Selling in)", "Ratio Sell Out vs Sell In (RP & Unit)", "MTM Contribution",
    "Revenue Konimex sell in (Unit)", "Revenue Konimex Sell Out (Unit)", "Achievement & Growth Sell Out & Sell In (RP & UNIT)",
    "Sales MNJ", "Service Level", "DOI RM - PM", "DOI Finished Good (KX & MNJ) Unit", "DOI FG",
    "Branch Availability DOI Total", "Cost Saving", "UPB Konimex (RP)", "UPB MNJ (RP)",
    "On Time Formulation", "Sumber Daya Manusia", "Complain Level", "Ratio UPB"
  ];
  // Halaman ini menampilkan laporan MCM Konimex Sell In (RP). Menu lain membuka halamannya sendiri:
  // isi alamat file-nya di sini (kosong = menampilkan pesan "belum tersedia").
  const CURRENT = REPORTS[1];
  const PAGES = {
    "TM BOD": "TM%20BOD.html",
    "MCM Konimex Sell In (RP)": "MCM%20KX%20SI.html",
    "Revenue Konimex Selling Out (RP)": "Revenue%20SO(RP).html",
    "Revenue Konimex Selling In (RP)": "Revenue%20KX%20SI.html",
    "Ratio Biaya (Biaya vs Selling in)": "Ratio%20Biaya.html",
    "Ratio Sell Out vs Sell In (RP & Unit)": "",
    "MTM Contribution": "",
    "Revenue Konimex sell in (Unit)": "",
    "Revenue Konimex Sell Out (Unit)": "Rev%20SO(UNIT).html",
    "Achievement & Growth Sell Out & Sell In (RP & UNIT)": "",
    "Sales MNJ": "",
    "Service Level": "",
    "DOI RM - PM": "",
    "DOI FG": "",
    "Branch Availability DOI Total": "",
    "Cost Saving": "",
    "UPB Konimex (RP)": "",
    "UPB MNJ (RP)": "",
    "On Time Formulation": "",
    "Sumber Daya Manusia": "",
    "Complain Level": "",
    "Ratio UPB": ""
  };
  const TABS = ["Corporate(incl.Bi No Product)", "Corporate (excl. Bi. Non Product)", "Pharma", "HCE", "Food", "EBITDA IB", "Ethical"];

  // Data hasil upload (kosong = angka & chart belum tampil).
  // Format: DATA[laporan][tab] = { cards: ["43.3%","9.0%","43.5%","6.7%"],
  //   chart: { labels: ["CORPORATE", ...], series: [{ name: "% Achievement YTD JUNI", values: [95, 43, 9] }, ...] } }
  const DATA = {};
  // Atau ambil dari server: GET DATA_URL?report=..&tab=..&period=YYYY-MM  -> mengembalikan objek { cards, chart }
  const DATA_URL = "";
  /* ============================================== */

  const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  const COLORS = ["#004586", "#ff420e", "#ffd320"];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const today = new Date();
  const currentYear = today.getFullYear(), currentMonth = today.getMonth() + 1;
  const st = { sec: "Dashboard", report: CURRENT, tab: TABS[0], period: currentYear + "-" + String(currentMonth).padStart(2, "0") };
  let token = 0, cur = null;

  function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2200); }
  const monthName = () => BULAN[+st.period.slice(5) - 1];

  function go(name) {
    $("side").classList.remove("open");
    if (name === CURRENT) return;
    if (PAGES[name]) location.href = PAGES[name];
    else toast("Halaman \"" + name + "\" belum tersedia.");
  }

  /* ---------- Bangun menu, tab, periode ---------- */
  REPORTS.forEach((r) => {
    const b = document.createElement("button"); b.textContent = r; b.dataset.r = r;
    b.onclick = () => go(r);
    $("menu").appendChild(b);
  });
  TABS.forEach((t) => {
    const b = document.createElement("button"); b.textContent = t; b.dataset.t = t; b.setAttribute("role", "tab");
    b.onclick = () => { st.tab = t; render(); };
    $("tabs").appendChild(b);
  });
  for (let year = currentYear; year >= 2025; year--) BULAN.forEach((m, i) => {
    if (year === currentYear && i + 1 > currentMonth) return;
    const o = document.createElement("option"); o.value = year + "-" + String(i + 1).padStart(2, "0"); o.textContent = m + " " + year;
    $("period").appendChild(o);
  });
  $("period").value = st.period;
  $("period").onchange = (e) => { st.period = e.target.value; render(); };
  document.querySelectorAll(".sec").forEach((b) => b.onclick = () => { if (b.dataset.sec !== "Dashboard") go("TM BOD"); });

  /* ---------- Menu titik tiga & burger ---------- */
  $("dotsBtn").onclick = (e) => { e.stopPropagation(); $("dotsMenu").classList.toggle("open"); };
  document.addEventListener("click", () => $("dotsMenu").classList.remove("open"));
  $("burger").onclick = () => { location.href = "../menu/page.html"; };
  $("main").addEventListener("click", (e) => {
    if (window.innerWidth <= 820 && $("side").classList.contains("open") && !$("side").contains(e.target) && e.target !== $("burger")) {
      $("side").classList.remove("open");
    }
  });

  /* ---------- Data ---------- */
  const chartReports = new Map();
  async function getData() {
    const period=st.period, tab=st.tab;
    if(!chartReports.has(period)) {
      chartReports.set(period,window.loadCorporateReportBuffer(period).then((buffer)=>XLSX.read(buffer,{type:"array"})).catch((error)=>{
        chartReports.delete(period);throw error;
      }));
    }
    try { return window.mcmChartData(await chartReports.get(period),tab,period); }
    catch(error) { toast(error.message || "Data grafik MCM gagal dimuat.");return null; }
  }
  // Dipanggil dari luar setelah file diupload: setDashboardData("Nama Laporan", "Corporate", {cards, chart})
  window.setDashboardData = (report, tab, obj) => { (DATA[report] = DATA[report] || {})[tab] = obj; render(); };

  /* ---------- Kartu KPI ---------- */
  const amount = (value) => typeof value === "number" && Number.isFinite(value) ? value.toLocaleString("id-ID",{maximumFractionDigits:0}) : "—";
  const percentage = (value) => typeof value === "number" && Number.isFinite(value) ? (value*100).toLocaleString("id-ID",{minimumFractionDigits:2,maximumFractionDigits:2})+"%" : "—";
  function renderCards() {
    const labels=["% Achievement YTD","% Achievement Tahun","Growth YTD"];
    $("cards").innerHTML=labels.map((label,i)=>'<div class="kpi"><p>'+esc(label)+'</p><b>'+esc(percentage(cur?.ratios?.[i]))+'</b></div>').join("");
  }
  function renderChart() {
    if(!cur){$("chart").innerHTML='<div class="empty">Data MCM belum tersedia untuk periode ini.</div>';return;}
    const values=cur.values,colors=["#ff420e","#ffd320","#579d1c"];
    const year=Number(st.period.slice(0,4)),month=monthName().toUpperCase();
    const labels=["Ach Last Year ("+(year-1)+") YTD "+month,"Target "+year+" YTD "+month,"Achievement YTD "+month];
    const numeric=values.filter((v)=>typeof v==="number" && Number.isFinite(v));
    if(!numeric.length){$("chart").innerHTML='<div class="empty">Nilai MCM belum tersedia untuk bagian ini.</div>';return;}
    const W=1000,H=550,L=100,R=35,T=125,B=135,ph=H-T-B;
    // Display RP (000.000) like the reference; workbook values remain RP (000).
    const displayed=values.map((v)=>typeof v==="number" && Number.isFinite(v)?v/1000:null);
    const numbers=displayed.filter((v)=>v!==null),min=Math.min(0,...numbers),max=Math.max(0,...numbers);
    const rawStep=(max-min || 1)/4, magnitude=10**Math.floor(Math.log10(rawStep));
    const step=[1,2,2.5,5,10].map((n)=>n*magnitude).find((n)=>n>=rawStep);
    const lo=Math.floor(min/step)*step,hi=Math.max(lo+step,Math.ceil(max/step)*step);
    const y=(v)=>T+ph*(hi-v)/(hi-lo),baseline=y(0);
    const axis=(v)=>v.toLocaleString("id-ID",{maximumFractionDigits:Math.abs(hi-lo)<10?2:0});
    let svg='<text x="'+L+'" y="28" font-size="14" fill="#666">RP(000)</text>';
    for(let v=lo;v<=hi+step/100;v+=step){
      svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#d9d9d9"/><text x="'+(L-14)+'" y="'+(y(v)+5)+'" font-size="14" text-anchor="end">'+esc(axis(v))+'</text>';
    }
    const centers=[280,660,720],bw=52;
    displayed.forEach((v,i)=>{
      if(v===null)return;
      svg+='<rect class="mcm-bar" data-series="'+i+'" tabindex="0" aria-label="'+esc(labels[i])+': '+esc(amount(values[i]))+' RP (000)" x="'+(centers[i]-bw/2)+'" y="'+Math.min(y(v),baseline)+'" width="'+bw+'" height="'+Math.abs(y(v)-baseline)+'" fill="'+colors[i]+'"></rect>';
    });
    const top=Math.min(y(Math.max(0,displayed[1]??0)),y(Math.max(0,displayed[2]??0)));
    const annotations=["Ach YTD "+percentage(cur.ratios?.[0]),"Ach Tahun "+percentage(cur.ratios?.[1]),"Growth "+percentage(cur.ratios?.[2])];
    annotations.forEach((text,i)=>{svg+='<text x="690" y="'+(top-66+i*21)+'" text-anchor="middle" font-size="15" font-weight="bold">'+esc(text)+'</text>';});
    svg+='<text x="280" y="'+(H-B+32)+'" text-anchor="middle" font-size="18">'+(year-1)+'</text><text x="690" y="'+(H-B+32)+'" text-anchor="middle" font-size="18">'+year+'</text>';
    labels.forEach((label,i)=>{
      const x=i===0?L:i===1?L:560,yy=i===0?H-62:H-25;
      svg+='<g class="mcm-legend" data-series="'+i+'"><rect x="'+x+'" y="'+(yy-12)+'" width="14" height="14" rx="3" fill="'+colors[i]+'"/><text x="'+(x+23)+'" y="'+yy+'" font-size="13" fill="#333">'+esc(label)+'</text></g>';
    });
    $("chart").innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafik MCM '+esc(st.tab)+': perbandingan YTD '+(year-1)+' dan '+year+'">'+svg+'</svg>';
    window.attachMcmChartHover($("chart"), labels, values, amount);
  }

  /* ---------- Catatan analisis ---------- */
  const NK = "konimex_notes";
  function loadNotes() { return window.AnalysisStore.snapshot(); }
  async function saveNotes(o) { return window.AnalysisStore.save(o); }
  const nkey = () => st.report + "|" + st.tab;
  let memNotes = {};
  window.AnalysisLock.configure({field:$("note"),toolbar:$("noteToolbar"),context:()=>({report:st.report,tab:st.tab}),notify:toast,refresh:()=>renderNotes()});

  let editingNote = null;
  function noteEditorIdentity() {
    try {
      const user = JSON.parse(sessionStorage.getItem('konimex_login_user') || 'null');
      return user && typeof user.username === 'string' ? {username: user.username, role: typeof user.role === 'string' ? user.role : ''} : null;
    } catch (_) { return null; }
  }
  function noteCreationCredit(note) {
    const person = note.createdBy;
    const identity = person && typeof person.username === 'string'
      ? 'Dibuat oleh ' + person.username : 'Dibuat';
    return '<header class="note-creation-credit">' + esc(identity) + ' · ' + esc(note.date) + '</header>';
  }
  function noteEditCredit(note) {
    if (!note.updatedAt) return '';
    const person = note.updatedBy;
    const identity = person && typeof person.username === 'string'
      ? ' oleh ' + person.username : '';
    return '<small class="note-edit-credit">Diedit' + esc(identity) + ' · ' + esc(note.updatedAt) + '</small>';
  }
  const pencilIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m16 3 5 5-12 12-6 1 1-6L16 3Z"/><path d="m14 5 5 5"/></svg>';
  const trashIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>';
  function renderNotes() {
    window.AnalysisLock.context();
    if (!window.AnalysisStore.loaded) {
      $("notes").textContent = "Memuat analisis…";
      window.AnalysisStore.ready().then(() => renderNotes()).catch((error) => { $("notes").textContent = error.message; });
      return;
    }
    if (editingNote && editingNote.key !== nkey()) { editingNote = null; $("note").value = ""; $("save").textContent = "Simpan"; }
    const all = Object.assign({}, memNotes, loadNotes());
    const list = all[nkey()] || [];
    $("notes").innerHTML = list.length ? list.map((n) =>
      '<article class="note">' + noteCreationCredit(n) + '<p>' + esc(n.text) + "</p><footer><span>" + '' + noteEditCredit(n) + '</span><span class="note-actions">' + window.AnalysisToTmBod.button(n.id) + '<button class="note-edit" data-action="edit" aria-label="Edit analisis" title="Edit analisis" data-id="' + n.id + '">' + pencilIcon + '</button><button class="note-delete" aria-label="Hapus analisis" title="Hapus analisis" data-id="' + n.id + '">' + trashIcon + '</button></span></footer></article>').join("")
      : '<p class="none">Belum ada catatan untuk laporan ini.</p>';
    $("notes").querySelectorAll("button").forEach((b) => b.onclick = async () => {
      if (b.dataset.action === "tm-bod") {
        b.disabled = true;
        try { await window.AnalysisToTmBod.send(b.dataset.id, st.period, toast); }
        finally { b.disabled = false; }
        return;
      }
      try { await window.AnalysisLock.ensure(); }
      catch (_) { return; }
      const o = Object.assign({}, memNotes, loadNotes());
      if (b.dataset.action === "edit") {
        const note = (o[nkey()] || []).find((n) => String(n.id) === b.dataset.id);
        if (!note) return;
        editingNote = {id: String(note.id), key: nkey()};
        $("note").value = note.text;
        $("save").textContent = "Simpan perubahan";
        $("note").focus(); $("note").scrollIntoView({behavior:"smooth",block:"center"});
        return;
      }
      if (editingNote?.id === b.dataset.id) { editingNote = null; $("note").value = ""; $("save").textContent = "Simpan"; }
      o[nkey()] = (o[nkey()] || []).filter((n) => String(n.id) !== b.dataset.id);
      try { await saveNotes(o); await window.AnalysisLock.release(); memNotes = {}; renderNotes(); }
      catch (error) { toast(error.message); }
    });
  }
  $("cancel").onclick = () => { window.AnalysisLock.release(); editingNote = null; $("save").textContent = "Simpan"; $("note").value = ""; toast("Dibatalkan"); };
  $("save").onclick = async () => {
    if (!window.AnalysisStore.loaded) { toast("Analisis belum terhubung ke database. Muat ulang halaman dan periksa koneksi."); return; }
    const text = $("note").value.trim();
    if (!text) { toast("Tulis analisis terlebih dahulu."); $("note").focus(); return; }
    try { await window.AnalysisLock.ensure(); } catch (_) { return; }
    const date = new Date().toLocaleString("id-ID", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
    const o = Object.assign({}, memNotes, loadNotes());
    const list = o[nkey()] = o[nkey()] || [];
    if (editingNote && editingNote.key === nkey()) {
      const note = list.find((n) => String(n.id) === editingNote.id);
      if (!note) { toast("Analisis tidak ditemukan. Muat ulang halaman."); return; }
      Object.assign(note, {text, updatedAt: date, updatedBy: noteEditorIdentity()});
    } else list.unshift({id: Date.now(), text, date, createdBy: noteEditorIdentity()});
    $("save").disabled = true;
    try { await saveNotes(o); await window.AnalysisLock.release(); }
    catch (error) { toast(error.message); return; }
    finally { $("save").disabled = false; }
    editingNote = null; $("save").textContent = "Simpan";
    memNotes = {};
    $("note").value = ""; renderNotes(); toast("Catatan tersimpan");
  };

  /* ---------- Unduh data (CSV) ---------- */
  $("dl").onclick = async () => {
    const c = cur && cur.chart;
    if (!c || !Array.isArray(c.labels) || !c.labels.length || !Array.isArray(c.series) || !c.series.length) { toast("Data belum tersedia."); return; }
    if (!window.XLSX) { toast("Komponen pembuat file Excel gagal dimuat."); return; }
    const workbook = XLSX.utils.book_new();
    const reportRows = [["Kategori"].concat(c.series.map((s) => s.name))];
    c.labels.forEach((lb, i) => reportRows.push([lb].concat(c.series.map((s) => s.values[i]))));
    const names = ["LAPORAN", "IB", "ETHICAL", "MNJ", "MTM", "UNIT", "REVENUE EDP MNJ", "BIAYA", "TARGET REVENUE", "DAFTAR", "LAUNCH", "BOD KX Sell In", "BOD MNJ", "BOD JML SDM", "BOD BI.Opr", "RATIO UPB", "UP BJ kx", "UPB non BJ", "UPB DISTR", "PARETO UPB DISTR AGT 26", "complaint - Accident", "NEAR ED TW 3", "TOP 10 NEAR ED TW 3"];
    names.forEach((name) => XLSX.utils.book_append_sheet(workbook, XLSX.utils.aoa_to_sheet(name === "BOD KX Sell In" ? reportRows : []), name));
    try { await replaceEdpTemplateSheet(workbook, st.period); } catch (error) { console.warn(error); }
    try {
      const reportYear = Number(st.period.slice(0, 4));
      const hjpData = await getEthicalHjpData(reportYear, reportYear + 1, reportYear - 1);
      await replaceEthicalTemplateSheet(workbook, st.period, hjpData);
    }
    catch (error) { toast(error.message || "Template Ethical gagal dimuat."); return; }
    const filename = (st.report + " - " + st.tab + " - " + st.period + ".xlsx").replace(/[\\/:*?"<>|]/g, "");
    try { await replaceBodMnjTemplateSheet(workbook, st.period); }
    catch (error) { toast(error.message || "BOD MNJ gagal dimuat."); return; }
    XLSX.writeFile(workbook, filename, { cellStyles: true });
  };

  /* ---------- Render utama ---------- */
  async function render() {
    $("secTitle").textContent = st.sec;
    $("repTitle").textContent = st.report;
    document.querySelectorAll(".sec").forEach((b) => b.classList.toggle("on", b.dataset.sec === st.sec));
    document.querySelectorAll("#menu button").forEach((b) => b.classList.toggle("on", b.dataset.r === st.report));
    document.querySelectorAll("#tabs button").forEach((b) => { const on = b.dataset.t === st.tab; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
    const my = ++token;
    const next = await getData();
    if (my !== token) return;
    cur = next; // abaikan hasil lama bila pengguna sudah pindah
    renderCards(); renderChart(); renderNotes();
  }
  /* ---------- Scroll horizontal tanpa scrollbar (roda mouse + geser dengan mouse) ---------- */
  function hScroll(el) {
    el.addEventListener("wheel", (e) => {
      if (el.scrollWidth <= el.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      e.preventDefault();
      el.scrollLeft += e.deltaY;
    }, { passive: false });

    let down = false, moved = false, sx = 0, sl = 0;
    el.addEventListener("pointerdown", (e) => {
      if (e.pointerType !== "mouse") return; // sentuhan sudah bisa digeser bawaan browser
      down = true; moved = false; sx = e.clientX; sl = el.scrollLeft;
    });
    window.addEventListener("pointermove", (e) => {
      if (!down) return;
      const dx = e.clientX - sx;
      if (Math.abs(dx) > 5) moved = true;
      if (moved) el.scrollLeft = sl - dx;
    });
    window.addEventListener("pointerup", () => { down = false; });
    el.addEventListener("click", (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  }
  hScroll($("tabs"));
  hScroll($("cards"));

  render();
</script>
<script src="scrollbar-auto-hide.js"></script>
<script src="sidebar-toggle.js"></script>
<script src="profile-menu.js"></script>
