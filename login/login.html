<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Laporan Korporat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Itim&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    display: flex;
    width: 100%;
    max-width: 840px;
    min-height: 520px;
    border-radius: 36px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 6px 6px rgba(0,0,0,.28);
  }

  /* ===== Kiri: form ===== */
  .left {
    flex: 1;
    padding: 56px 32px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .left h1 {
    font-family: 'Itim', cursive;
    font-weight: 400;
    font-size: 28px;
    margin-bottom: 56px;
    color: #111;
  }
  form { width: 100%; max-width: 320px; display: flex; flex-direction: column; flex: 1; }
  label { font-size: 13px; color: #000; margin-bottom: 4px; display: block; }
  .field {
    display: flex;
    align-items: stretch;
    border: 1px solid #000;
    border-radius: 8px;
    height: 36px;
    margin-bottom: 16px;
    overflow: hidden;
    background: #fff;
  }
  .field .icon {
    width: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 1px solid #000;
    flex-shrink: 0;
  }
  .field input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    padding: 0 10px;
    font-family: inherit;
    font-size: 13px;
  }
  .field input::placeholder { color: #9a9a9a; }
  .field:focus-within { box-shadow: 0 0 0 2px rgba(11,184,169,.45); }
  .field .toggle {
    width: 38px;
    border: 0;
    border-left: 1px solid #000;
    background: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg.i { width: 16px; height: 16px; fill: #000; }

  .btn {
    margin: auto auto 0;
    width: 161px;
    height: 41px;
    border: 0;
    border-radius: 14px;
    background: #0bb8a9;
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background .2s;
  }
  .btn:hover { background: #09a094; }
  .btn:focus-visible { outline: 3px solid #1e3a8a; outline-offset: 2px; }
  .error { color: #c62828; font-size: 12px; min-height: 16px; margin-top: -8px; }

  /* ===== Kanan: panel biru ===== */
  .right {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #1e3a8a;
    padding: 36px 32px;
    color: #fff;
    border-top-right-radius: 36px;
  }
  .logo {
    display: inline-flex;
    align-items: flex-start;
    gap: 2px;
    font-weight: 700;
    font-style: italic;
    font-size: 27px;
    letter-spacing: -.5px;
    color: #e31e24;
  }
  .logo svg { width: 24px; height: 24px; margin-top: -4px; }
  .right h2 { margin-top: 70px; margin-left: 30px; font-size: 24px; font-weight: 700; }
  .right p { margin: 38px 0 0 30px; font-size: 13px; color: #8fb4ff; }

  .illustration {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    width: 100%;
    height: 215px;
    opacity: .28;
    pointer-events: none;
  }

  /* ===== Responsif ===== */
  @media (max-width: 720px) {
    .card { flex-direction: column-reverse; border-radius: 28px; }
    .right { border-radius: 28px 28px 0 0; min-height: 300px; }
    .right h2 { margin-top: 40px; }
    .left { padding-top: 40px; }
    .left h1 { margin-bottom: 32px; }
    .btn { margin-top: 28px; }
  }
</style>
</head>
<body>

<main class="card">
  <!-- Form login -->
  <section class="left">
    <h1>Selamat Datang</h1>

    <form id="loginForm" novalidate>
      <label for="user">Username or Email</label>
      <div class="field">
        <span class="icon" aria-hidden="true">
          <svg class="i" viewBox="0 0 24 24"><path d="M2 5h20v2.2l-10 6.3L2 7.2V5zm0 4.6l10 6.3 10-6.3V19H2V9.6z"/></svg>
        </span>
        <input type="text" id="user" placeholder="Input your Username or Email" autocomplete="username" required>
      </div>

      <label for="pass">Password</label>
      <div class="field">
        <span class="icon" aria-hidden="true">
          <svg class="i" viewBox="0 0 24 24"><path d="M12 1a5 5 0 00-5 5v3H6a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V11a2 2 0 00-2-2h-1V6a5 5 0 00-5-5zm-3 8V6a3 3 0 016 0v3H9zm3 4a2 2 0 011 3.7V19h-2v-2.3A2 2 0 0112 13z"/></svg>
        </span>
        <input type="password" id="pass" placeholder="Input your Password" autocomplete="current-password" required>
        <button type="button" class="toggle" id="toggle" aria-label="Tampilkan password">
          <svg class="i" viewBox="0 0 24 24" id="eye" aria-hidden="true"><path d="M12 5c-5.2 0-9.2 3.3-11 7 1.8 3.7 5.8 7 11 7s9.2-3.3 11-7c-1.8-3.7-5.8-7-11-7zm0 11a4 4 0 110-8 4 4 0 010 8zm0-2a2 2 0 100-4 2 2 0 000 4z"/></svg>
        </button>
      </div>

      <div class="error" id="error" role="alert"></div>

      <button type="submit" class="btn">LOGIN</button>
    </form>
  </section>

  <!-- Panel informasi -->
  <aside class="right">
    <div class="logo" aria-label="Konimex">
      KONIMEX
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="8" cy="6" r="4" fill="#e31e24"/>
        <circle cx="17" cy="9" r="4" fill="#e31e24"/>
        <circle cx="10" cy="16" r="4" fill="#e31e24"/>
      </svg>
    </div>

    <h2>Laporan Korporat</h2>
    <p>Akses portal pelaporan internal</p>

    <!-- Ilustrasi grafik (dekoratif) -->
    <svg class="illustration" viewBox="0 0 420 215" preserveAspectRatio="xMaxYMax slice" aria-hidden="true">
      <rect x="330" y="30" width="30" height="185" fill="#cfd8f5"/>
      <rect x="290" y="75" width="30" height="140" fill="#cfd8f5"/>
      <rect x="250" y="55" width="30" height="160" fill="#cfd8f5"/>
      <rect x="370" y="95" width="30" height="120" fill="#cfd8f5"/>
      <polyline points="210,185 250,150 280,175 340,95 395,40" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
      <polygon points="385,22 410,22 410,48" fill="#fff"/>
      <rect x="20" y="40" width="130" height="175" rx="6" fill="#cfd8f5"/>
      <polyline points="40,150 70,100 95,135 130,80" fill="none" stroke="#1e3a8a" stroke-width="3"/>
      <circle cx="170" cy="105" r="18" fill="#fff"/>
      <rect x="150" y="125" width="50" height="75" rx="14" fill="#fff"/>
      <rect x="130" y="175" width="100" height="14" rx="7" fill="#fff"/>
    </svg>
  </aside>
</main>

<script>
  const pass = document.getElementById('pass');
  const toggle = document.getElementById('toggle');
  const eye = document.getElementById('eye');
  const error = document.getElementById('error');

  // Tampilkan / sembunyikan password
  toggle.addEventListener('click', () => {
    const hidden = pass.type === 'password';
    pass.type = hidden ? 'text' : 'password';
    toggle.setAttribute('aria-label', hidden ? 'Sembunyikan password' : 'Tampilkan password');
    eye.innerHTML = hidden
      ? '<path d="M3.3 2 2 3.3l3 3C3.1 7.5 1.7 9.2 1 12c1.8 3.7 5.8 7 11 7 1.7 0 3.3-.4 4.7-1l3 3 1.3-1.3L3.3 2zm8.7 15c-3.6 0-6.7-2.1-8.2-5  .6-1.3 1.6-2.4 2.8-3.2l2 2a4 4 0 005.4 5.4l1.1 1.1c-1 .4-2 .7-3.1.7zM12 5c-1.1 0-2.1.2-3.1.5l1.7 1.7A4 4 0 0116.8 13l2.2 2.2c.8-.9 1.5-1.9 2-3.2-1.8-3.7-5.8-7-11-7z"/>'
      : '<path d="M12 5c-5.2 0-9.2 3.3-11 7 1.8 3.7 5.8 7 11 7s9.2-3.3 11-7c-1.8-3.7-5.8-7-11-7zm0 11a4 4 0 110-8 4 4 0 010 8zm0-2a2 2 0 100-4 2 2 0 000 4z"/>';
  });

  // Validasi sederhana
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const user = document.getElementById('user').value.trim();
    if (!user || !pass.value) {
      error.textContent = 'Isi username/email dan password.';
      return;
    }
    if (user !== 'test 1' || pass.value !== 'test 1') {
      error.textContent = 'Username atau password salah.';
      return;
    }
    error.textContent = '';
    window.location.href = '../menu/page.html';
  });
</script>
</body>
</html>
