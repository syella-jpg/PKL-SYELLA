<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - Laporan Korporat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { color-scheme: light; --ink: #172033; --muted: #64748b; --brand: #1e3a8a; --accent: #e31e24; }
  body {
    font-family: 'Inter', sans-serif;
    background: #f3f6fb;
    color: var(--ink);
    min-height: 100vh;
  }

  /* ===== Header ===== */
  header {
    position: sticky;
    top: 0;
    z-index: 2;
    background: rgba(255,255,255,.96);
    min-height: 76px;
    padding: 0 max(24px, calc((100vw - 1240px) / 2));
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #e5eaf2;
    box-shadow: 0 2px 12px rgba(23,32,51,.04);
  }
  .logo {
    display: inline-flex;
    align-items: flex-start;
    gap: 2px;
    font-weight: 700;
    font-style: italic;
    font-size: 32px;
    letter-spacing: -1px;
    color: #e31e24;
    text-decoration: none;
  }
  .logo svg { width: 26px; height: 26px; margin-top: -6px; }
  .welcome { font-size: 15px; font-weight: 600; color: var(--muted); }

  /* ===== Konten ===== */
  main { width: min(1240px, 100%); margin: 0 auto; padding: 42px 24px 64px; }

  .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
  .page-heading h1 { font-size: clamp(25px, 3vw, 34px); letter-spacing: -1px; margin-bottom: 8px; }
  .page-heading p { color: var(--muted); font-size: 14px; }
  .toolbar { display: flex; justify-content: flex-end; }
  .upload {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    min-height: 42px;
    padding: 0 16px;
    background: var(--brand);
    color: #fff;
    border: 0;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, transform .15s;
  }
  .upload svg { width: 18px; height: 18px; fill: currentColor; }
  .upload:hover { background: #294ba5; transform: translateY(-1px); }
  .upload:focus-visible, .card:focus-visible { outline: 3px solid #75a5ff; outline-offset: 3px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
  }
  .card {
    display: block;
    position: relative;
    background: #fff;
    border: 1px solid #e5eaf2;
    border-radius: 14px;
    padding: 18px;
    min-height: 128px;
    text-decoration: none;
    color: #111;
    box-shadow: 0 3px 10px rgba(23,32,51,.035);
    transition: transform .18s, box-shadow .18s, border-color .18s;
  }
  .card:hover { transform: translateY(-3px); border-color: #bdcbee; box-shadow: 0 12px 24px rgba(30,58,138,.1); }
  .card small {
    display: inline-flex;
    border-radius: 999px;
    padding: 5px 8px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .15px;
    color: #294ba5;
    background: #edf2ff;
    margin-bottom: 12px;
  }
  .card span { display: block; font-size: 14px; line-height: 1.45; font-weight: 600; }

  /* ===== Responsif ===== */
  @media (max-width: 960px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 640px) {
    header { padding: 0 18px; min-height: 66px; }
    .logo { font-size: 28px; }
    .welcome { font-size: 13px; }
    main { padding: 30px 18px 48px; }
    .page-heading { align-items: flex-start; flex-direction: column; margin-bottom: 22px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .card { padding: 14px; min-height: 122px; }
    .card span { font-size: 13px; }
  }
  @media (max-width: 390px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <a class="logo" href="#" aria-label="Konimex">
    KONIMEX
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="8" cy="6" r="4" fill="#e31e24"/>
      <circle cx="17" cy="9" r="4" fill="#e31e24"/>
      <circle cx="10" cy="16" r="4" fill="#e31e24"/>
    </svg>
  </a>
  <div class="welcome">Selamat datang</div>
</header>

<main>
  <div class="page-heading">
    <div>
      <h1>Laporan Korporat</h1>
      <p>Pilih laporan yang ingin Anda lihat.</p>
    </div>
    <div class="toolbar">
      <a class="upload" href="../upload/page.html" aria-label="Buka halaman upload file laporan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v18H3V3zm9 4l-5 5h3.5v5h3v-5H17l-5-5z"/></svg>
        Upload File
      </a>
    </div>
  </div>

  <section class="grid" id="grid" aria-label="Daftar laporan"></section>
</main>
//ubah menu
<script>
  // Tambah / ubah laporan cukup lewat daftar ini
  const reports = [
    ["Revenue & Sales", "Revenue Konimex Selling Out (RP)"],
    ["Revenue & Sales", "MCM Konimex Sell In (RP)"],
    ["Revenue & Sales", "Revenue Konimex Selling In (RP)"],
    ["Revenue & Sales", "Ratio Biaya (Biaya vs Selling in)"],
    ["Revenue & Sales", "Ratio Sell Out vs Sell In (RP & Unit)"],
    ["Revenue & Sales", "MTM Contribution"],
    ["Revenue & Sales", "Revenue Konimex Sell In (Unit)"],
    ["Revenue & Sales", "Revenue Konimex Sell Out (Unit)"],
    ["Revenue & Sales", "Achievement & Growth Sell Out & Sell In (RP & UNIT)"],
    ["Revenue & Sales", "Sales MNJ"],
    ["Operasional & Supply", "Service Level"],
    ["Operasional & Supply", "DOI RM - PM"],
    ["Operasional & Supply", "DOI Finished Good (KX & MNJ) Unit"],
    ["Operasional & Supply", "DOI FG"],
    ["Operasional & Supply", "Branch Availability DOI Total"],
    ["Operasional & Supply", "Cost Saving"],
    ["Produk, Mutu & SDM", "UPB Konimex (RP)"],
    ["Produk, Mutu & SDM", "UPB MNJ (RP)"],
    ["Produk, Mutu & SDM", "On Time Formulation"],
    ["Produk, Mutu & SDM", "Sumber Daya Manusia"],
    ["Produk, Mutu & SDM", "Complain Level"],
    ["Produk, Mutu & SDM", "Ratio UPB"]
  ];
//mana yang bisa diakses disini
  const grid = document.getElementById('grid');
  const reportPages = {
    'Revenue Konimex Selling Out (RP)': '../dashboard/Revenue%20SO(RP).html',
    'MCM Konimex Sell In (RP)': '../dashboard/MCM%20KX%20SI.html',
    'Revenue Konimex Selling In (RP)': '../dashboard/Revenue%20KX%20SI.html',
    'Revenue Konimex Sell In (Unit)': '../dashboard/Revenue%20SI(Unit).html',
    'Ratio Biaya (Biaya vs Selling in)': '../dashboard/Ratio%20Biaya.html',
  };
  reports.forEach(([kategori, judul]) => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = reportPages[judul] || '#'; // ganti dengan link laporan masing-masing
    a.innerHTML = '<small></small><span></span>';
    a.querySelector('small').textContent = kategori;
    a.querySelector('span').textContent = judul;
    grid.appendChild(a);
  });

</script>
</body>
</html>
